slug: jrc-eurofound-task-db
name: "JRC-Eurofound Task Database"
source: "European Commission Joint Research Centre (JRC) + Eurofound"
geography: [EU27]
type: survey-derived
access: free
url: "https://joint-research-centre.ec.europa.eu/projects-and-activities/employment/skills-intelligence-online-job-advertisements_en"
api_available: false
update_frequency: irregular
description: |
  Occupational task profiles derived from representative European worker surveys (EWCS and
  other Eurofound sources). Each occupation has a structured task profile across dimensions:
  intellectual/analytical tasks, social/communication tasks, manual/physical tasks, routine
  vs. non-routine, autonomous vs. supervised work. Enables OJA task signal validation.
data_dimensions:
  - occupation: "ISCO-08 (4-digit)"
  - task_types: [intellectual, social, manual, routine, non-routine, autonomous, collaborative]
  - digital_intensity: "Digital tool use scale"
  - ai_exposure: "Estimated AI substitutability score"
use_cases:
  - "Validate OJA task signals against survey-based ground truth"
  - "Measure gap between employer-stated tasks (OJA) and actual job content (survey)"
  - "AI exposure scoring by occupation"
  - "Career pathway adjacency: which occupations share task profiles?"
companion_tool: "Skill-Task Dictionary (JRC, available on Zenodo)"
quality_notes: |
  Task profiles are survey-derived averages — within-occupation heterogeneity is masked.
  AI exposure scores are model-based estimates, not direct measurement.
  Coverage: EU working population (no WB6 data).
tags: [task-profiles, occupation, isco08, ai-exposure, survey-data]
