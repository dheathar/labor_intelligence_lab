slug: eurostat-labour
name: Eurostat Labour Market Statistics
source: Eurostat / European Commission
geography: [european_union]
type: official-statistics
access: free
url: "https://ec.europa.eu/eurostat/web/labour-market"
api_available: true
api_url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/"
update_frequency: "daily (11:00 and 23:00 CET)"
size: "200+ datasets covering EU27 + EFTA"
temporal_coverage: "1983–present"
tags: [employment, unemployment, wages, job-vacancies, labour-costs, regional]
description: |
  Harmonized official EU labour market statistics from all member states.
  Includes LFS-derived aggregates, job vacancy statistics (NACE Rev.2 quarterly),
  labour costs and cost indices, earnings (gross/net, gender pay gaps, minimum wages),
  and NUTS2-level regional breakdowns. REST API and SDMX 3.0 + 2.1 APIs available.
  Updated twice daily.
key_variables:
  - employment rates (total, by age, sex, education, NUTS2)
  - unemployment rates (overall, youth, long-term)
  - job vacancy rate (by sector)
  - gender pay gap
  - labour cost index
  - minimum wage levels
