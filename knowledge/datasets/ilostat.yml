slug: ilostat
name: ILOSTAT — ILO Labour Statistics Database
source: International Labour Organization (ILO)
geography: [global]
type: official-statistics
access: free
url: "https://ilostat.ilo.org/"
api_available: true
api_url: "https://sdmx.ilo.org/rest/"
update_frequency: varies (annual/quarterly/monthly by indicator)
size: "190+ countries, 100+ indicators, back to 1938"
temporal_coverage: "1938–present"
tags: [global, employment, unemployment, wages, productivity, informal-economy, sdmx]
description: |
  World's largest labour statistics repository. Free and open access with
  multiple access modes: online viewer, Excel add-in, bulk download (CSV + dictionary),
  Rilostat R package, and SDMX web service APIs. Greece country profile available
  with 2024–2025 Q2 data. Critical for global and cross-country comparative analysis.
key_variables:
  - employment and unemployment (by sex, age, education, sector)
  - wages and earnings
  - working time and hours
  - labour productivity
  - informal employment
  - labour force participation
