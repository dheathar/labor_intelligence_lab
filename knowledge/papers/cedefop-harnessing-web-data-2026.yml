slug: cedefop-harnessing-web-data-2026
title: "Harnessing Web Data for Next-Generation Skills Intelligence — Conference Proceedings"
authors: [Cedefop, Eurostat]
year: 2026
venue: "Cedefop–Eurostat Research Conference, Thessaloniki"
url: "https://www.cedefop.europa.eu/en/events/harnessing-web-data-next-generation-skills-intelligence"
topics: [oja, skills-intelligence, green-skills, digital-skills, regional-analysis, occupation-classification, ai-skills, career-pathways, gender-equity]
