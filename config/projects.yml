    work_packages:
      - id: WP1
        title: "Development of an analytical model and evaluation framework for ALMPs"
        lead: IRS
        start_month: 2
        end_month: 27
        person_months: 21.0
        objective: |
          Understanding complexity of labour market policy effectiveness through evidence-based
          analysis: definitions of ALMPs and skills matching, key trends, and determinants
          of effective ALMPs via meta-evaluation.
        tasks:
          - "T1.1: Definitions of ALMPs and skills matching — literature review"
          - "T1.2: Identification of key trends affecting labour market and skills"
          - "T1.3: Determinants for effective ALMPs — meta-evaluation"
        deliverables: [D1.1]
      - id: WP2
        title: "In-depth analysis of skill matching strategies and approaches"
        lead: GUT
        start_month: 3
        end_month: 12
        person_months: 48.0
        objective: |
          In-depth analysis of skill-matching strategies in partner countries through stakeholder
          mapping, good practice identification, and community of practice workshops.
        tasks:
          - "T2.1: Mapping of stakeholders and skills eco-systems in 5 partner countries"
          - "T2.2: Identification of existing and emerging good practices"
          - "T2.3: Ten in-depth case studies (2 per country)"
          - "T2.4: Community of practice workshop on AI-based matching tools"
        deliverables: [D2.1, D2.2]
      - id: WP3
        title: "AI-Powered Repository for ALMPs Knowledge Management"
        lead: UOP
        start_month: 2
        end_month: 36
        person_months: 45.0
        objective: |
          Build an AI-powered ALMP knowledge repository with metadata annotation tools
          and an interactive ALMP Design Wizard for policy practitioners.
        tasks:
          - "T3.1: Comprehensive data acquisition and curation for ALMPs repository"
          - "T3.2: Enhanced metadata annotation tool with AI assistance"
          - "T3.3: Scalable repository architecture design"
          - "T3.4: Interactive ALMP Design Wizard development"
        deliverables: [D3.1, D3.2]
      - id: WP4
        title: "Crawling and Analysis of Online Job Postings and Administrative Data"
        lead: UOP
        start_month: 6
        end_month: 36
        person_months: 41.0
        objective: |
          Develop a user-friendly Labour Market Analysis Tool that integrates OJA data
          and administrative records to support evidence-based ALMP design.
        tasks:
          - "T4.1: Multi-source OJA crawler infrastructure (12+ countries)"
          - "T4.2: Administrative data integration (LFS, PES registers, Eurostat)"
          - "T4.3: Labour Market Analysis Tool development"
          - "T4.4: Ethics compliance and data governance"
        deliverables: [D4.1, D4.2, D4.3, D4.4, D4.5]
        livlab_note: "D4.1 is the LIVLAB portal — the primary DMLab software deliverable"
      - id: WP5
        title: "Advanced ALMP Development Tool Leveraging Individuals CV Insights"
        lead: UOP
        start_month: 10
        end_month: 36
        person_months: 28.0
        objective: |
          Develop a comprehensive platform that analyses individual CV data to generate
          personalised ALMP recommendations for job seekers and employment counsellors.
        tasks:
          - "T5.1: CV data ingestion and skills extraction pipeline"
          - "T5.2: Matching mechanism — CV skills vs. labour market needs"
          - "T5.3: Platform UI and ALMP recommendation engine"
        deliverables: [D5.1, D5.2]
      - id: WP6
        title: "Innovation experiments"
        lead: DomSpain
        start_month: 21
        end_month: 33
        person_months: 65.5
        objective: |
          Run four innovation experiments with employment services and practitioners
          to test ALMP tools in real contexts and collect empirical evidence.
        tasks:
          - "T6.1: Experiment design and partner preparation"
          - "T6.2: Four country experiments (GR, IT, ES, PL)"
          - "T6.3: Experiment monitoring and data collection"
          - "T6.4: Synthesis and lessons learned"
        deliverables: [D6.1]
      - id: WP7
        title: "Evaluation of research and experimentation results"
        lead: TIG
        start_month: 2
        end_month: 36
        person_months: 49.0
        objective: |
          Participative development and fine-tuning of ALMPs and skills policy design;
          final evaluation and policy recommendations.
        tasks:
          - "T7.1: Evaluation framework development"
          - "T7.2: Ongoing monitoring of project results"
          - "T7.3: Policy recommendations synthesis"
        deliverables: [D7.1]
      - id: WP8
        title: "Dissemination, Exploitation and Communication"
        lead: p_consulting
        start_month: 1
        end_month: 36
        person_months: 43.0
        objective: |
          Maximise reach and impact through scientific publications, EU-ALMPO Ambassador
          Network, policy briefs, and a comprehensive communication strategy.
        tasks:
          - "T8.1: Dissemination and exploitation planning"
          - "T8.2: Website, logo and communication toolkit"
          - "T8.3: Scientific publications (8 papers)"
          - "T8.4: EU-ALMPO Ambassadors Network"
          - "T8.5: Clustering policy briefs"
          - "T8.6: Final dissemination evaluation"
        deliverables: [D8.1, D8.2, D8.3, D8.4, D8.5, D8.6, D8.7, D8.8]
      - id: WP9
        title: "Project Management and Quality Assurance"
        lead: UOP
        start_month: 1
        end_month: 36
        person_months: 40.0
        objective: |
          Overall project coordination, quality assurance, ethics compliance,
          and stakeholder engagement.
        tasks:
          - "T9.1: Project governance and consortium management"
          - "T9.2: Project management structure and plan"
          - "T9.3: Financial management and reporting"
          - "T9.4: Ethics and data protection compliance"
          - "T9.5: Peer review of deliverables (HAEA)"
        deliverables: [D9.1, D9.2, D9.3]

