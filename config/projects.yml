    start_date: "2024-01-01"
    end_date: "2026-12-31"
    status: active
    theme: vocational-training
    programme: "Erasmus+"
    description: |
      Erasmus+ project on vocational training and lifelong learning intelligence.
      Uses labor market data to align VET curricula with actual skill demand.
    countries: [EU member states]
    data_sources:
      - Cedefop Skills Forecast
      - ESCO taxonomy
      - National VET statistics
