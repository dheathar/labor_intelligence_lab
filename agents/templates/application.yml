                                                 # oja-intelligence | regional-analysis

status: research                                 # research | prototype | production

description: |
  What the application does, who uses it, and what decisions it informs.
  Be specific about geographic scope and data vintage.

data_sources:                                    # slugs from knowledge/datasets/
  - dataset-slug

methods_used:                                    # slugs from knowledge/methods/
  - method-slug

outputs:
  - "Monthly skill demand index by ISCO-2 occupation"
  - "Country-level dashboard"

url: "https://..."                               # public-facing URL if available
code_url: "https://github.com/..."              # omit if not open source

