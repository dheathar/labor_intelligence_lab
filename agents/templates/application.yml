# ── LIVLAB APPLICATION TEMPLATE ──────────────────────────────────────────────
# Constitution rules:
#   [1] Evidence first — link to real deployment or published evaluation
#   [2] Honest data — document what data the application actually uses
#   [3] Reproducibility — note if pipeline is code-available
#
# REQUIRED: slug, name, category, status, description, data_sources, livlab_relevance
# OPTIONAL: methods_used, url, code_url, outputs, project
# ─────────────────────────────────────────────────────────────────────────────

slug: application-name-kebab

name: "Application Name"
